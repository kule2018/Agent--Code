<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
*{box-sizing:border-box}body{margin:0;color:#f7f4e9;font-family:system-ui,"PingFang SC",sans-serif;background:#091319 url("{{BACKGROUND}}") center/cover fixed}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(4,12,17,.92),rgba(4,12,17,.43));pointer-events:none}main{position:relative;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:780px;padding:40px clamp(24px,6vw,80px)}small{color:#d1b679;text-transform:uppercase;font-weight:700}h1{font-size:clamp(32px,5vw,58px);line-height:1.1;margin:18px 0}p{font-size:19px;line-height:1.95;white-space:pre-wrap}button{display:block;width:100%;text-align:left;background:rgba(245,247,243,.11);border:1px solid rgba(245,247,243,.3);border-radius:6px;color:inherit;padding:16px 20px;font:inherit;cursor:pointer;margin:10px 0}button:hover,button:focus{background:rgba(178,211,178,.24);outline-color:#b9d7b2}#history{font-size:13px;color:#c0c9c8;margin:18px 0}#restart{width:auto;background:none;border:0;padding:8px 0;color:#c8dfcf;text-decoration:underline}#choices{margin-top:18px}
</style></head><body><main><small id="progress"></small><h1 id="title"></h1><p id="content"></p><div id="choices"></div><div id="history"></div><button id="restart" type="button">重新开始</button></main><script>{{ENGINE}}</script><script>
const game={{GAME}};let session=StoryEngine.startGame(game);const byId=id=>document.getElementById(id);function render(){const scene=StoryEngine.currentScene(game,session);byId('progress').textContent=scene.ending?'结局 / '+scene.id:'场景 / '+scene.id;byId('title').textContent=scene.title;byId('content').textContent=scene.content;byId('history').textContent=session.history.length?'已作出 '+session.history.length+' 次选择':'';const root=byId('choices');root.replaceChildren();for(const choice of StoryEngine.availableChoices(scene,session.flags)){const button=document.createElement('button');button.textContent=choice.text;button.onclick=()=>{session=StoryEngine.choose(game,session,choice.id);render()};root.append(button)}}byId('restart').onclick=()=>{session=StoryEngine.startGame(game);render()};render();
</script></body></html>
