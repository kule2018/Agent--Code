name: story-game-agent-python
services:
  postgres:
    image: postgres:17-alpine
    container_name: story-game-agent-python-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: story_course
      POSTGRES_PASSWORD: story_course
      POSTGRES_DB: story_agent
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_course -d story_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - story_agent_python_data:/var/lib/postgresql/data
volumes:
  story_agent_python_data:
