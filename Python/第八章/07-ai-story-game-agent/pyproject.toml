[project]
name = "agent-course-ai-story-game-agent-python"
version = "0.1.0"
description = "Story studio with Python, Deep Agents, LangGraph, and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.19",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langchain==1.4.2",
    "langchain-deepseek==1.1.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
