[project]
name = "agent-course-ai-presentation-agent-python"
version = "0.1.0"
description = "AI presentation agent with FastAPI, LangGraph, PostgreSQL, and PPTX export"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "pydantic>=2.10,<3",
    "python-pptx>=1.0,<2",
    "typing-extensions>=4.12,<5",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
