services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-review-postgres
    environment:
      POSTGRES_USER: agent_course
      POSTGRES_PASSWORD: agent_course
      POSTGRES_DB: agent_review
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_course -d agent_review"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agent-review-postgres-data:/var/lib/postgresql/data

volumes:
  agent-review-postgres-data:
