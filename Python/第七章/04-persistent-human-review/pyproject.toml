[project]
name = "agent-course-persistent-human-review-python"
version = "0.1.0"
description = "Persistent human review demo with LangGraph interrupts and PostgreSQL checkpoints"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.5",
    "pydantic==2.13.4",
    "typing-extensions==4.15.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "review_workflow",
    "workflow",
]
