services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-partial-generation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_partial_generation
      POSTGRES_USER: agent_course
      POSTGRES_PASSWORD: agent_course
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_course -d agent_partial_generation"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent-partial-generation-postgres-data:/var/lib/postgresql/data

volumes:
  agent-partial-generation-postgres-data:
